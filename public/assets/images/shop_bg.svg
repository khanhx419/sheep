<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Dark bg -->
  <rect width="400" height="400" fill="#2a1f14"/>
  <!-- Back wall -->
  <rect x="10" y="10" width="380" height="380" fill="#3d2b1f" rx="5"/>
  <!-- Wood plank texture lines -->
  <line x1="10" y1="80" x2="390" y2="80" stroke="#4a3628" stroke-width="1"/>
  <line x1="10" y1="160" x2="390" y2="160" stroke="#4a3628" stroke-width="1"/>
  <line x1="10" y1="240" x2="390" y2="240" stroke="#4a3628" stroke-width="1"/>
  <line x1="10" y1="320" x2="390" y2="320" stroke="#4a3628" stroke-width="1"/>
  <!-- Top shelf -->
  <rect x="30" y="60" width="340" height="8" fill="#8B7355" rx="2"/>
  <rect x="30" y="55" width="340" height="5" fill="#9d8466"/>
  <!-- Items on top shelf -->
  <rect x="60" y="30" width="20" height="28" fill="#cc4444" rx="3"/>
  <rect x="120" y="35" width="25" height="23" fill="#44aa44" rx="3"/>
  <rect x="200" y="25" width="18" height="33" fill="#4488cc" rx="3"/>
  <rect x="270" y="32" width="22" height="26" fill="#ddaa33" rx="3"/>
  <rect x="330" y="28" width="16" height="30" fill="#aa44aa" rx="3"/>
  <!-- Middle shelf -->
  <rect x="30" y="155" width="340" height="8" fill="#8B7355" rx="2"/>
  <rect x="30" y="150" width="340" height="5" fill="#9d8466"/>
  <!-- Items on middle shelf -->
  <circle cx="70" cy="138" r="12" fill="#ffd700"/>
  <rect x="120" y="125" width="30" height="28" fill="#885533" rx="4"/>
  <rect x="200" y="130" width="24" height="23" fill="#338855" rx="3"/>
  <circle cx="290" cy="140" r="10" fill="#dd6644"/>
  <rect x="330" y="128" width="22" height="25" fill="#5566aa" rx="3"/>
  <!-- Bottom shelf -->
  <rect x="30" y="250" width="340" height="8" fill="#8B7355" rx="2"/>
  <rect x="30" y="245" width="340" height="5" fill="#9d8466"/>
  <!-- Items on bottom shelf -->
  <rect x="50" y="220" width="28" height="28" fill="#aa6633" rx="4"/>
  <rect x="130" y="218" width="35" height="30" fill="#664422" rx="4"/>
  <circle cx="230" cy="232" r="14" fill="#448844"/>
  <rect x="300" y="222" width="26" height="26" fill="#cc8844" rx="3"/>
  <!-- Counter -->
  <rect x="10" y="330" width="380" height="60" fill="#6b5240" rx="3"/>
  <rect x="10" y="325" width="380" height="8" fill="#8B7355" rx="2"/>
  <!-- Counter items -->
  <circle cx="100" cy="355" r="8" fill="#ffd700" opacity="0.8"/>
  <text x="100" y="359" text-anchor="middle" font-family="Arial" font-size="8" fill="#996600" font-weight="bold">Xu</text>
  <!-- Hanging lantern -->
  <line x1="200" y1="10" x2="200" y2="95" stroke="#8B7355" stroke-width="2"/>
  <rect x="188" y="90" width="24" height="30" fill="#ffaa33" rx="5" opacity="0.8"/>
  <rect x="192" y="95" width="16" height="20" fill="#ffcc66" rx="3" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ddc8a0" font-weight="bold">Cửa hàng</text>
</svg>
