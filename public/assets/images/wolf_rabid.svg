<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body (red tinted) -->
  <ellipse cx="32" cy="38" rx="20" ry="14" fill="#8a3333"/>
  <!-- Darker back -->
  <ellipse cx="34" cy="33" rx="16" ry="8" fill="#772828"/>
  <!-- Tail (bristled) -->
  <path d="M52 34 Q60 26 56 18" stroke="#772828" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Back legs -->
  <rect x="40" y="48" width="4.5" height="11" rx="2" fill="#6a2222"/>
  <rect x="46" y="48" width="4.5" height="11" rx="2" fill="#6a2222"/>
  <!-- Front legs -->
  <rect x="16" y="48" width="4.5" height="11" rx="2" fill="#6a2222"/>
  <rect x="22" y="48" width="4.5" height="11" rx="2" fill="#6a2222"/>
  <!-- Head -->
  <ellipse cx="16" cy="26" rx="12" ry="10" fill="#8a3333"/>
  <!-- Snout -->
  <ellipse cx="8" cy="29" rx="8" ry="5" fill="#994444"/>
  <!-- Nose -->
  <ellipse cx="4" cy="27" rx="2.5" ry="2" fill="#222"/>
  <!-- Mouth / snarl -->
  <path d="M3 29 Q8 36 15 30" stroke="#551111" stroke-width="1.2" fill="none"/>
  <!-- More teeth -->
  <polygon points="5,29 6,33 7,29" fill="white"/>
  <polygon points="8,29.5 9,33.5 10,29.5" fill="white"/>
  <polygon points="11,30 12,33.5 13,30" fill="white"/>
  <!-- Drool drops -->
  <ellipse cx="7" cy="35" rx="1" ry="2" fill="#aaddaa" opacity="0.7"/>
  <ellipse cx="11" cy="36" rx="0.8" ry="1.8" fill="#aaddaa" opacity="0.6"/>
  <circle cx="7" cy="38" r="1" fill="#aaddaa" opacity="0.4"/>
  <!-- Eyes (bright red, wild) -->
  <circle cx="13" cy="23" r="3.5" fill="#ff4444"/>
  <circle cx="21" cy="22" r="3.5" fill="#ff4444"/>
  <circle cx="14" cy="23" r="1.3" fill="#1a1a1a"/>
  <circle cx="22" cy="22" r="1.3" fill="#1a1a1a"/>
  <!-- Intense eye glow -->
  <circle cx="13" cy="23" r="5" fill="#ff4444" opacity="0.2"/>
  <circle cx="21" cy="22" r="5" fill="#ff4444" opacity="0.2"/>
  <!-- Bloodshot lines -->
  <line x1="10" y1="22" x2="11" y2="23" stroke="#ff6666" stroke-width="0.4"/>
  <line x1="16" y1="23" x2="15" y2="23" stroke="#ff6666" stroke-width="0.4"/>
  <line x1="18" y1="21" x2="19" y2="22" stroke="#ff6666" stroke-width="0.4"/>
  <line x1="24" y1="22" x2="23" y2="22" stroke="#ff6666" stroke-width="0.4"/>
  <!-- Ears (sharp, bristled) -->
  <polygon points="7,20 1,4 15,16" fill="#772828"/>
  <polygon points="20,18 23,2 29,15" fill="#772828"/>
  <!-- Inner ear -->
  <polygon points="8,18 4,8 13,16" fill="#994444"/>
  <polygon points="21,17 24,6 27,15" fill="#994444"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#cc4444">Sói dại</text>
</svg>
