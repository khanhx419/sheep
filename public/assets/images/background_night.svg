<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Night sky -->
  <rect width="400" height="400" fill="#0a0a2e"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="120" cy="70" r="1" fill="white" opacity="0.7"/>
  <circle cx="200" cy="30" r="2" fill="white" opacity="0.8"/>
  <circle cx="280" cy="60" r="1" fill="white" opacity="0.6"/>
  <circle cx="350" cy="90" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="80" cy="130" r="1" fill="white" opacity="0.5"/>
  <circle cx="160" cy="110" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="310" cy="40" r="1" fill="white" opacity="0.7"/>
  <circle cx="240" cy="100" r="2" fill="white" opacity="0.6"/>
  <circle cx="30" cy="100" r="1" fill="white" opacity="0.8"/>
  <circle cx="370" cy="150" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="140" cy="160" r="1" fill="white" opacity="0.5"/>
  <circle cx="60" cy="180" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="330" cy="170" r="1" fill="white" opacity="0.9"/>
  <circle cx="190" cy="150" r="1" fill="white" opacity="0.7"/>
  <!-- Crescent Moon -->
  <circle cx="320" cy="80" r="35" fill="#f0e68c"/>
  <circle cx="335" cy="70" r="30" fill="#0a0a2e"/>
  <!-- Moon glow -->
  <circle cx="320" cy="80" r="45" fill="#f0e68c" opacity="0.08"/>
  <circle cx="320" cy="80" r="55" fill="#f0e68c" opacity="0.04"/>
  <!-- Dark hills -->
  <ellipse cx="100" cy="290" rx="180" ry="55" fill="#0d1a0d"/>
  <ellipse cx="330" cy="295" rx="150" ry="50" fill="#0f1f0f"/>
  <!-- Dark ground -->
  <rect y="290" width="400" height="110" fill="#0d1a0d"/>
  <!-- Fence silhouette -->
  <line x1="20" y1="285" x2="380" y2="285" stroke="#1a2a1a" stroke-width="3"/>
  <line x1="20" y1="295" x2="380" y2="295" stroke="#1a2a1a" stroke-width="3"/>
  <rect x="40" y="270" width="5" height="35" fill="#1a2a1a"/>
  <rect x="120" y="270" width="5" height="35" fill="#1a2a1a"/>
  <rect x="200" y="270" width="5" height="35" fill="#1a2a1a"/>
  <rect x="280" y="270" width="5" height="35" fill="#1a2a1a"/>
  <rect x="360" y="270" width="5" height="35" fill="#1a2a1a"/>
  <!-- Label -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a4a8a" font-weight="bold">Nông trại - Ban đêm</text>
</svg>
