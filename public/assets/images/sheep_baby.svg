<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Smaller body -->
  <ellipse cx="32" cy="38" rx="16" ry="13" fill="#dcdcdc"/>
  <!-- Wool bumps -->
  <circle cx="20" cy="32" r="6" fill="#d0d0d0"/>
  <circle cx="32" cy="28" r="6" fill="#d4d4d4"/>
  <circle cx="43" cy="33" r="5" fill="#d0d0d0"/>
  <circle cx="25" cy="28" r="5" fill="#d8d8d8"/>
  <circle cx="38" cy="27" r="5" fill="#d8d8d8"/>
  <!-- Head (rounder, bigger proportionally) -->
  <ellipse cx="32" cy="24" rx="9" ry="10" fill="#3a3a3a"/>
  <!-- Big cute eyes -->
  <circle cx="28" cy="22" r="3" fill="white"/>
  <circle cx="36" cy="22" r="3" fill="white"/>
  <circle cx="29" cy="21.5" r="1.5" fill="#1a1a1a"/>
  <circle cx="37" cy="21.5" r="1.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="29.8" cy="20.5" r="0.7" fill="white"/>
  <circle cx="37.8" cy="20.5" r="0.7" fill="white"/>
  <!-- Tiny nose -->
  <ellipse cx="32" cy="27" rx="1.5" ry="1" fill="#555"/>
  <!-- Small smile -->
  <path d="M30 28.5 Q32 30 34 28.5" stroke="#555" stroke-width="0.7" fill="none"/>
  <!-- Ears -->
  <ellipse cx="22" cy="18" rx="4" ry="2.5" fill="#444" transform="rotate(-25 22 18)"/>
  <ellipse cx="42" cy="18" rx="4" ry="2.5" fill="#444" transform="rotate(25 42 18)"/>
  <!-- Short legs -->
  <rect x="23" y="48" width="3.5" height="8" rx="1.5" fill="#3a3a3a"/>
  <rect x="29" y="48" width="3.5" height="8" rx="1.5" fill="#3a3a3a"/>
  <rect x="35" y="48" width="3.5" height="8" rx="1.5" fill="#3a3a3a"/>
  <rect x="41" y="48" width="3.5" height="8" rx="1.5" fill="#3a3a3a"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#666">Cừu con</text>
</svg>
