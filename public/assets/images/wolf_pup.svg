<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Small body -->
  <ellipse cx="32" cy="40" rx="15" ry="11" fill="#ff8866"/>
  <!-- Lighter belly -->
  <ellipse cx="30" cy="43" rx="10" ry="7" fill="#ffaa88"/>
  <!-- Tail (small, curled) -->
  <path d="M47 37 Q52 32 50 28" stroke="#ee7755" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Back legs (short) -->
  <rect x="38" y="48" width="4" height="8" rx="2" fill="#dd6644"/>
  <rect x="43" y="48" width="4" height="8" rx="2" fill="#dd6644"/>
  <!-- Front legs (short) -->
  <rect x="20" y="48" width="4" height="8" rx="2" fill="#dd6644"/>
  <rect x="25" y="48" width="4" height="8" rx="2" fill="#dd6644"/>
  <!-- Head (bigger relative to body) -->
  <ellipse cx="24" cy="28" rx="12" ry="11" fill="#ff8866"/>
  <!-- Snout (shorter) -->
  <ellipse cx="17" cy="31" rx="6" ry="4" fill="#ffaa88"/>
  <!-- Nose -->
  <ellipse cx="13" cy="29" rx="2" ry="1.5" fill="#333"/>
  <!-- Mouth (less menacing) -->
  <path d="M14 31 Q17 33 20 31" stroke="#cc5533" stroke-width="0.7" fill="none"/>
  <!-- Small tooth -->
  <polygon points="16,31 16.5,33 17,31" fill="white"/>
  <!-- Eyes (less scary, rounder) -->
  <circle cx="20" cy="25" r="3" fill="white"/>
  <circle cx="28" cy="24" r="3" fill="white"/>
  <circle cx="20.5" cy="25" r="1.5" fill="#553322"/>
  <circle cx="28.5" cy="24" r="1.5" fill="#553322"/>
  <!-- Eye shine -->
  <circle cx="21" cy="24" r="0.6" fill="white"/>
  <circle cx="29" cy="23" r="0.6" fill="white"/>
  <!-- Ears (floppy-ish) -->
  <polygon points="14,22 10,10 20,18" fill="#ee7755"/>
  <polygon points="28,20 32,8 34,18" fill="#ee7755"/>
  <!-- Inner ear -->
  <polygon points="15,20 12,13 19,18" fill="#ffaa88"/>
  <polygon points="29,19 32,11 33,18" fill="#ffaa88"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#cc6644">Sói con</text>
</svg>
