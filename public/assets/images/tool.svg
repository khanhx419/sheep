<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Handle -->
  <rect x="14" y="12" width="4" height="20" rx="1.5" fill="#8B6914"/>
  <!-- Handle grain -->
  <line x1="15" y1="14" x2="15" y2="30" stroke="#7a5c10" stroke-width="0.4"/>
  <line x1="17" y1="14" x2="17" y2="30" stroke="#7a5c10" stroke-width="0.4"/>
  <!-- Metal head connector -->
  <rect x="12" y="10" width="8" height="4" rx="1" fill="#888"/>
  <!-- Pitchfork tines -->
  <rect x="8" y="1" width="2" height="11" rx="0.8" fill="#999"/>
  <rect x="15" y="1" width="2" height="11" rx="0.8" fill="#999"/>
  <rect x="22" y="1" width="2" height="11" rx="0.8" fill="#999"/>
  <!-- Tine points -->
  <polygon points="8,2 9,0 10,2" fill="#999"/>
  <polygon points="15,2 16,0 17,2" fill="#999"/>
  <polygon points="22,2 23,0 24,2" fill="#999"/>
  <!-- Crossbar -->
  <rect x="7" y="9" width="18" height="2.5" rx="1" fill="#888"/>
  <!-- Metal shine -->
  <line x1="9" y1="3" x2="9" y2="8" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
  <line x1="16" y1="3" x2="16" y2="8" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
  <line x1="23" y1="3" x2="23" y2="8" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
</svg>
