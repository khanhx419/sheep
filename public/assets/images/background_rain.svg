<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Dark grey sky -->
  <rect width="400" height="400" fill="#3a3a4a"/>
  <!-- Storm clouds -->
  <ellipse cx="80" cy="50" rx="90" ry="35" fill="#2a2a3a"/>
  <ellipse cx="200" cy="40" rx="100" ry="40" fill="#252535"/>
  <ellipse cx="320" cy="55" rx="90" ry="30" fill="#2a2a3a"/>
  <ellipse cx="150" cy="60" rx="70" ry="30" fill="#222232"/>
  <ellipse cx="300" cy="45" rx="80" ry="35" fill="#222232"/>
  <!-- Rain streaks -->
  <g stroke="#7799bb" stroke-width="1" opacity="0.5">
    <line x1="30" y1="80" x2="20" y2="200"/>
    <line x1="70" y1="90" x2="60" y2="210"/>
    <line x1="110" y1="75" x2="100" y2="195"/>
    <line x1="150" y1="85" x2="140" y2="205"/>
    <line x1="190" y1="70" x2="180" y2="190"/>
    <line x1="230" y1="95" x2="220" y2="215"/>
    <line x1="270" y1="80" x2="260" y2="200"/>
    <line x1="310" y1="90" x2="300" y2="210"/>
    <line x1="350" y1="75" x2="340" y2="195"/>
    <line x1="390" y1="85" x2="380" y2="205"/>
    <line x1="50" y1="160" x2="40" y2="310"/>
    <line x1="130" y1="155" x2="120" y2="305"/>
    <line x1="210" y1="165" x2="200" y2="315"/>
    <line x1="290" y1="150" x2="280" y2="300"/>
    <line x1="370" y1="170" x2="360" y2="320"/>
  </g>
  <!-- Muddy ground -->
  <rect y="280" width="400" height="120" fill="#2a3a20"/>
  <!-- Puddles -->
  <ellipse cx="80" cy="320" rx="35" ry="8" fill="#4a5a6a" opacity="0.6"/>
  <ellipse cx="250" cy="330" rx="45" ry="10" fill="#4a5a6a" opacity="0.5"/>
  <ellipse cx="350" cy="310" rx="25" ry="6" fill="#4a5a6a" opacity="0.6"/>
  <!-- Puddle reflections -->
  <ellipse cx="80" cy="318" rx="20" ry="4" fill="#5a6a7a" opacity="0.3"/>
  <ellipse cx="250" cy="328" rx="25" ry="5" fill="#5a6a7a" opacity="0.3"/>
  <!-- Fence (wet) -->
  <line x1="20" y1="275" x2="380" y2="275" stroke="#5a4a2a" stroke-width="3"/>
  <line x1="20" y1="285" x2="380" y2="285" stroke="#5a4a2a" stroke-width="3"/>
  <rect x="40" y="260" width="5" height="35" fill="#5a4a2a"/>
  <rect x="120" y="260" width="5" height="35" fill="#5a4a2a"/>
  <rect x="200" y="260" width="5" height="35" fill="#5a4a2a"/>
  <rect x="280" y="260" width="5" height="35" fill="#5a4a2a"/>
  <rect x="360" y="260" width="5" height="35" fill="#5a4a2a"/>
  <!-- Label -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6a7a8a" font-weight="bold">Nông trại - Mưa</text>
</svg>
