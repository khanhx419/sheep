<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="15" fill="#ffd700" opacity="0.15"/>
  <!-- Coin shadow -->
  <circle cx="16" cy="16" r="13" fill="#b8860b"/>
  <!-- Coin face -->
  <circle cx="16" cy="16" r="12" fill="#ffd700"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#daa520" stroke-width="1"/>
  <!-- Inner ring 2 -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#daa520" stroke-width="0.5"/>
  <!-- Xu text -->
  <text x="16" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#996600" font-weight="bold">Xu</text>
  <!-- Coin shine -->
  <ellipse cx="12" cy="10" rx="4" ry="3" fill="white" opacity="0.25" transform="rotate(-30 12 10)"/>
  <!-- Edge notches -->
  <circle cx="16" cy="3" r="0.8" fill="#daa520"/>
  <circle cx="16" cy="29" r="0.8" fill="#b8860b"/>
  <circle cx="3" cy="16" r="0.8" fill="#daa520"/>
  <circle cx="29" cy="16" r="0.8" fill="#b8860b"/>
</svg>
