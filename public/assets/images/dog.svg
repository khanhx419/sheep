<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body -->
  <ellipse cx="30" cy="38" rx="18" ry="13" fill="#c0813d"/>
  <!-- Tail (wagging) -->
  <path d="M48 32 Q58 22 54 18" stroke="#c0813d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Back legs -->
  <rect x="38" y="47" width="5" height="11" rx="2" fill="#a86e30"/>
  <rect x="44" y="47" width="5" height="11" rx="2" fill="#a86e30"/>
  <!-- Front legs -->
  <rect x="16" y="47" width="5" height="11" rx="2" fill="#a86e30"/>
  <rect x="22" y="47" width="5" height="11" rx="2" fill="#a86e30"/>
  <!-- Chest lighter area -->
  <ellipse cx="22" cy="40" rx="8" ry="9" fill="#d49550"/>
  <!-- Head -->
  <ellipse cx="18" cy="24" rx="12" ry="11" fill="#c0813d"/>
  <!-- Snout -->
  <ellipse cx="12" cy="27" rx="7" ry="5" fill="#d49550"/>
  <!-- Nose -->
  <ellipse cx="9" cy="25" rx="2.5" ry="2" fill="#2a2a2a"/>
  <!-- Mouth -->
  <path d="M9 27 Q12 31 16 28" stroke="#8a5c25" stroke-width="0.8" fill="none"/>
  <!-- Tongue -->
  <ellipse cx="13" cy="30" rx="2" ry="2.5" fill="#ee7777"/>
  <!-- Eyes -->
  <circle cx="15" cy="21" r="2.5" fill="white"/>
  <circle cx="22" cy="20" r="2.5" fill="white"/>
  <circle cx="15.5" cy="20.5" r="1.3" fill="#3a2510"/>
  <circle cx="22.5" cy="19.5" r="1.3" fill="#3a2510"/>
  <!-- Eye shine -->
  <circle cx="16" cy="20" r="0.5" fill="white"/>
  <circle cx="23" cy="19" r="0.5" fill="white"/>
  <!-- Ears (pointed) -->
  <polygon points="10,18 5,6 16,14" fill="#a86e30"/>
  <polygon points="22,16 24,4 30,14" fill="#a86e30"/>
  <!-- Inner ear -->
  <polygon points="11,16 7,8 15,14" fill="#d49550"/>
  <polygon points="23,15 25,7 28,14" fill="#d49550"/>
  <!-- Collar -->
  <ellipse cx="22" cy="32" rx="10" ry="3" fill="#cc3333" stroke="#aa2222" stroke-width="0.5"/>
  <circle cx="22" cy="34" r="2" fill="#ffd700"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#666">Chó</text>
</svg>
