<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body (fluffy wool) -->
  <ellipse cx="32" cy="35" rx="22" ry="18" fill="#f0f0f0"/>
  <!-- Wool bumps -->
  <circle cx="15" cy="28" r="8" fill="#e8e8e8"/>
  <circle cx="25" cy="22" r="7" fill="#ececec"/>
  <circle cx="37" cy="21" r="8" fill="#e8e8e8"/>
  <circle cx="47" cy="27" r="7" fill="#ececec"/>
  <circle cx="13" cy="38" r="6" fill="#e5e5e5"/>
  <circle cx="50" cy="37" r="6" fill="#e5e5e5"/>
  <circle cx="31" cy="20" r="6" fill="#f0f0f0"/>
  <!-- Head -->
  <ellipse cx="32" cy="18" rx="10" ry="11" fill="#2a2a2a"/>
  <!-- Eyes -->
  <circle cx="28" cy="16" r="2.5" fill="white"/>
  <circle cx="36" cy="16" r="2.5" fill="white"/>
  <circle cx="29" cy="15.5" r="1.2" fill="#1a1a1a"/>
  <circle cx="37" cy="15.5" r="1.2" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="29.5" cy="14.8" r="0.5" fill="white"/>
  <circle cx="37.5" cy="14.8" r="0.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="32" cy="21" rx="2" ry="1.2" fill="#555"/>
  <!-- Ears -->
  <ellipse cx="21" cy="13" rx="5" ry="3" fill="#333" transform="rotate(-20 21 13)"/>
  <ellipse cx="43" cy="13" rx="5" ry="3" fill="#333" transform="rotate(20 43 13)"/>
  <!-- Legs -->
  <rect x="20" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="28" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="36" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="44" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#666">Cừu</text>
</svg>
