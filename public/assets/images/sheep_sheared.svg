<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sheared body (pink skin, no wool) -->
  <ellipse cx="32" cy="36" rx="19" ry="15" fill="#ffcccc"/>
  <ellipse cx="32" cy="36" rx="19" ry="15" fill="none" stroke="#eeb0b0" stroke-width="0.8"/>
  <!-- Skin texture dots -->
  <circle cx="22" cy="33" r="0.8" fill="#eeb5b5"/>
  <circle cx="28" cy="38" r="0.6" fill="#eeb5b5"/>
  <circle cx="38" cy="32" r="0.7" fill="#eeb5b5"/>
  <circle cx="42" cy="39" r="0.6" fill="#eeb5b5"/>
  <circle cx="32" cy="42" r="0.8" fill="#eeb5b5"/>
  <!-- Head -->
  <ellipse cx="32" cy="20" rx="10" ry="11" fill="#2a2a2a"/>
  <!-- Eyes (slightly embarrassed look) -->
  <circle cx="28" cy="18" r="2.5" fill="white"/>
  <circle cx="36" cy="18" r="2.5" fill="white"/>
  <circle cx="28.5" cy="18" r="1.2" fill="#1a1a1a"/>
  <circle cx="36.5" cy="18" r="1.2" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="29" cy="17" r="0.5" fill="white"/>
  <circle cx="37" cy="17" r="0.5" fill="white"/>
  <!-- Blush -->
  <ellipse cx="25" cy="22" rx="3" ry="1.5" fill="#ff8888" opacity="0.5"/>
  <ellipse cx="39" cy="22" rx="3" ry="1.5" fill="#ff8888" opacity="0.5"/>
  <!-- Nose -->
  <ellipse cx="32" cy="23" rx="2" ry="1.2" fill="#555"/>
  <!-- Ears -->
  <ellipse cx="21" cy="15" rx="5" ry="3" fill="#333" transform="rotate(-20 21 15)"/>
  <ellipse cx="43" cy="15" rx="5" ry="3" fill="#333" transform="rotate(20 43 15)"/>
  <!-- Legs -->
  <rect x="20" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="28" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="36" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <rect x="44" y="48" width="4" height="10" rx="2" fill="#2a2a2a"/>
  <!-- Tiny wool remnant on top -->
  <circle cx="30" cy="11" r="2" fill="#e0e0e0"/>
  <circle cx="34" cy="10" r="2.5" fill="#e0e0e0"/>
  <!-- Label -->
  <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#666">Cừu đã cắt lông</text>
</svg>
